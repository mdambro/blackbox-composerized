services:
  blackbox-server:
    image: ghcr.io/mdambro/blackbox-server:latest
    container_name: blackbox-server
    restart: unless-stopped
    #ports:
    #  - "8080:8080"
    volumes:
      - blackbox_data:/data
    env_file:
      - .env

  blackbox-agent:
    image: ghcr.io/maxjb-xyz/blackbox-agent:latest
    container_name: blackbox-agent
    restart: unless-stopped
    depends_on:
      - blackbox-server
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - blackbox_agent_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc:/watch/etc:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    env_file:
      - .env

volumes:
  blackbox_agent_data:
    name: blackbox_agent_data_volume
  blackbox_data:
    name: blackbox_data_volume
